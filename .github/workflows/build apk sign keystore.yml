name: Build BitcoinJ Wallet

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"


      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not set."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            | sort \
            | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"


      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Android SDK licenses accepted."


      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"


      - name: Verify Java
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDK Manager:"
          "$SDKMANAGER" --version

          echo ""
          echo "Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Android build-tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "AAPT2:"
          "$ANDROID_HOME/build-tools/33.0.2/aapt2" version

          echo ""
          echo "APK Signer:"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" --version


      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew


      - name: Verify Gradle
        run: |
          ./gradlew --version


      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease \
            --stacktrace \
            --no-daemon


      - name: Find release APK
        run: |
          APK=$(find . \
            -path "*/build/outputs/apk/release/*.apk" \
            -type f \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "Release APK:"
          echo "$APK"

          cp \
            "$APK" \
            "$RUNNER_TEMP/BitcoinJ-Wallet-unsigned.apk"


      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is not configured."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: EXPECTED_CERT_SHA256 is not configured."
            exit 1
          fi

          echo "All signing secrets are configured."


      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/keystore.jks"

          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore restored."


      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool \
            -list \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/keystore-info.txt"

          echo "Keystore verified."
          echo "Alias: $KEY_ALIAS"


      - name: Find apksigner
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          "$APKSIGNER" --version


      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
            "$RUNNER_TEMP/BitcoinJ-Wallet-unsigned.apk"

          echo "Release APK signed."


      - name: Verify APK signature
        run: |
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/BitcoinJ-Wallet.apk"


      - name: Verify certificate fingerprint
        env:
          EXPECTED_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          ACTUAL=$(
            "$APKSIGNER" verify \
              --print-certs \
              "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
              | grep "Signer #1 certificate SHA-256 digest:" \
              | head -1 \
              | sed 's/.*: //' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[:space:]'
          )

          EXPECTED=$(
            printf '%s' "$EXPECTED_SHA256" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[:space:]'
          )

          echo "Expected certificate SHA-256:"
          echo "$EXPECTED"

          echo "Actual certificate SHA-256:"
          echo "$ACTUAL"

          if [ -z "$ACTUAL" ]; then
            echo "ERROR: Certificate fingerprint not found."
            exit 1
          fi

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo ""
            echo "ERROR: Certificate fingerprint mismatch."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CERTIFICATE VERIFIED"
          echo "FINGERPRINT MATCH"
          echo "=========================================="


      - name: Prepare final APK
        run: |
          cp \
            "$RUNNER_TEMP/BitcoinJ-Wallet.apk" \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk"


      - name: Generate APK SHA-256
        run: |
          sha256sum \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk" \
            | tee \
            "$GITHUB_WORKSPACE/BitcoinJ-Wallet.apk.sha256"


      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinJ-Wallet-SIGNED
          path: |
            BitcoinJ-Wallet.apk
            BitcoinJ-Wallet.apk.sha256
          if-no-files-found: error
          retention-days: 90
