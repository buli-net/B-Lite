name: Build APK B-Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "build-tools;36.0.0"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" --version

      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          echo "APK=$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/signing/release.keystore"

          UNSIGNED_APK="${{ steps.apk.outputs.apk }}"
          SIGNED_APK="$RUNNER_TEMP/signing/B-Lite.apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

      - name: Verify APK signature
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          SIGNED_APK="$RUNNER_TEMP/signing/B-Lite.apk"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          CERT_DIGEST=$(
            "$APKSIGNER" verify --print-certs "$SIGNED_APK" 2>&1 |
            sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' |
            head -n 1 |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_DIGEST=$(printf '%s' "$EXPECTED_CERT_SHA256" |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]')

          if [ -z "$CERT_DIGEST" ]; then
            echo "ERROR: Could not read APK certificate SHA-256 digest."
            exit 1
          fi

          if [ -z "$EXPECTED_DIGEST" ]; then
            echo "ERROR: EXPECTED_CERT_SHA256 is empty."
            exit 1
          fi

          if [ "$CERT_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "ERROR: APK certificate SHA-256 does not match EXPECTED_CERT_SHA256."
            exit 1
          fi

          echo "APK certificate SHA-256 verified successfully."

      - name: Prepare signed APK artifact
        shell: bash
        run: |
          mkdir -p app/build/outputs/apk/release

          cp \
            "$RUNNER_TEMP/signing/B-Lite.apk" \
            app/build/outputs/apk/release/B-Lite.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: B-Lite
          path: app/build/outputs/apk/release/*-Lite.apk
          if-no-files-found: error
