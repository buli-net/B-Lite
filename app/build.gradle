plugins {
    id 'com.android.application'
    id 'com.google.protobuf' version '0.10.0'
}

android {
    namespace 'wallet.main'
    compileSdk 37

    defaultConfig {
        applicationId 'wallet.main'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles project.android.getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.29.3'
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // bitcoinj 0.17.1 is compiled from source in this same app module.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.83'
    implementation 'com.google.guava:guava:33.7.2-android'
    implementation 'com.google.protobuf:protobuf-javalite:4.36.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'net.jcip:jcip-annotations:1.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'uk.uuid.slf4j:slf4j-android:2.0.17-0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.easymock:easymock:5.6.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'org.slf4j:slf4j-jdk14:2.0.17'
    testImplementation 'nl.jqno.equalsverifier:equalsverifier:3.18.1'
    testImplementation 'org.hamcrest:hamcrest-library:3.0'
    testImplementation 'pl.pragmatists:JUnitParams:1.1.1'
}

tasks.withType(Test).configureEach {
    exclude 'org/bitcoinj/net/discovery/DnsDiscoveryTest*'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
